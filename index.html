<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暮色情歌 | 伤感音乐馆</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="bg-blur"></div>
    <div class="container">
        <header class="page-header">
            <h1>暮色伤情歌集</h1>
            <p>把遗憾藏进旋律，独自慢慢释怀</p>
        </header>

        <!-- 播放器主卡片 -->
        <div class="player-card">
            <!-- 黑胶唱片动画 -->
            <div class="record-box">
                <div class="record" id="record"></div>
            </div>

            <div class="song-text">
                <h2 id="songName">未播放</h2>
                <span id="singer">--</span>
            </div>

            <!-- 进度条 -->
            <div class="progress-area">
                <input type="range" id="progress" min="0" max="100" value="0">
                <div class="time-row">
                    <span id="currentTime">00:00</span>
                    <span id="totalTime">00:00</span>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="control-buttons">
                <button id="prev">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>
                </button>
                <button id="playBtn" class="play-main">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                </button>
                <button id="next">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path></svg>
                </button>
            </div>
        </div>

        <!-- 歌单列表 -->
        <div class="list-wrap">
            <h3>歌单列表</h3>
            <div class="song-list" id="songList"></div>
        </div>

        <audio id="audio" preload="auto">
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
