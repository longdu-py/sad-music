<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伤感私藏情歌播放器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <!-- 音频可视化画布 -->
    <canvas id="audioCanvas"></canvas>

    <!-- 歌曲封面 -->
    <div class="cover-box">
        <div class="cover"></div>
    </div>

    <!-- 歌曲信息 -->
    <div class="song-info">
        <h2 id="songName">未选择歌曲</h2>
        <p id="songAuthor">伤感情歌合集</p>
    </div>

    <!-- 进度条 -->
    <div class="progress-wrap">
        <span id="currentTime">00:00</span>
        <div class="progress-bar" id="progressBar">
            <div class="progress-inner" id="progressInner"></div>
        </div>
        <span id="totalTime">00:00</span>
    </div>

    <!-- 控制按钮 -->
    <div class="control-box">
        <button class="prev-btn" id="prev">上一首</button>
        <button class="play-btn" id="playBtn">播放</button>
        <button class="next-btn" id="next">下一首</button>
    </div>

    <!-- 本地上传歌曲 -->
    <div class="upload-area">
        <label for="musicInput">点击添加你的伤感情歌</label>
        <input type="file" id="musicInput" accept="audio/mp3" multiple hidden>
    </div>

    <!-- 歌单列表 -->
    <div class="playlist" id="playlist"></div>

    <!-- 原生音频标签 -->
    <audio id="audio">
</div>

<script src="app.js"></script>
</body>
</html>
